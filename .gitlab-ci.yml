stages:
  - test
  - build
  - docker

variables:
  MYSQL_DATABASE: labresults
  MYSQL_ROOT_PASSWORD: secret
  MYSQL_USER: labuser
  MYSQL_PASSWORD: labpassword

test-backend:
  stage: test
  image: php:8.3-cli
  services:
    - mysql:8.0
  variables:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: labresults
    DB_USERNAME: labuser
    DB_PASSWORD: labpassword
  before_script:
    - apt-get update && apt-get install -y git zip unzip libonig-dev libxml2-dev default-mysql-client
    - docker-php-ext-install pdo pdo_mysql mbstring
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd backend
    - composer install --no-interaction --prefer-dist
    - cp .env.example .env
    - sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=mysql/' .env
    - echo "DB_HOST=mysql" >> .env
    - echo "DB_PORT=3306" >> .env
    - echo "DB_DATABASE=labresults" >> .env
    - echo "DB_USERNAME=labuser" >> .env
    - echo "DB_PASSWORD=labpassword" >> .env
    - php artisan key:generate
    - php artisan jwt:secret
    - php artisan migrate --force
  script:
    - php artisan test

build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

docker-build:
  stage: docker
  image: docker:24
  services:
    - docker:dind
  only:
    - main
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA ./backend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA ./frontend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA