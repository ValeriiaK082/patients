version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lab_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: labresults
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: labuser
      MYSQL_PASSWORD: labpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lab_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_KEY: ""
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: labresults
      DB_USERNAME: labuser
      DB_PASSWORD: labpassword
      JWT_SECRET: your_jwt_secret_here
    depends_on:
      - db
    networks:
      - lab_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - lab_network

volumes:
  db_data:

networks:
  lab_network:
    driver: bridge